name: Lint Build Deployment Task
on:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Node js
        uses: actions/setup-node@v4
      - name: Install Dependancies
        run: npm ci
      - name: run lint
        run: npm run lint
      - name: test
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Node js
        uses: actions/setup-node@v4
      - name: Install Dependancies
        run: npm ci
      - name: run build
        run: npm run build
      - name: Upload atrifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            dist
            package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Node js
        uses: actions/setup-node@v4
      - name: Install Dependancies
        run: npm ci
      - name: run deploy
        run: echo "DEPLOY TASK RUNNING..."
